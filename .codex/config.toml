[[hooks.PostToolUse]]
matcher = "apply_patch|Bash"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "bash tool/hooks/comment_density.sh"
commandWindows = "powershell.exe -NoProfile -Command \"& ((git --exec-path) + '/../../../bin/bash.exe') tool/hooks/comment_density.sh; exit $LASTEXITCODE\""
timeout = 15
statusMessage = "Checking comment density"
