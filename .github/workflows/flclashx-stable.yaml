name: FlClashX stable artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for the prepared release (vX.Y.Z, vX.Y.Z-buildN, or vX.Y.Z-pre.N)
        required: true
        type: string
      android_test_only:
        description: Build a side-by-side Android APK for local testing
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  FLCLASHX_UPDATE_REPOSITORY: ${{ github.repository }}
  FLCLASHX_UPDATE_TAG: ${{ inputs.release_tag }}

jobs:
  version:
    if: github.repository == 'Ive4/FlClashX'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^version: (\d+\.\d+\.\d+)\+([1-9]\d*)$", source, re.M)
          if not match:
              raise SystemExit("Expected version+build in pubspec.yaml")
          version, build = match.groups()
          tag = os.environ["RELEASE_TAG"]
          if tag not in (f"v{version}", f"v{version}-build{build}") and not re.fullmatch(
              rf"v{re.escape(version)}-pre\.[1-9]\d*(?:\+\d+)?", tag
          ):
              raise SystemExit("Release tag does not match pubspec.yaml")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nbuild={build}\n")
          PY

  windows:
    needs: version
    if: ${{ !inputs.android_test_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: windows-2022
            channel: stable
          - arch: arm64
            os: windows-11-arm
            channel: master
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up LLVM MinGW
        shell: pwsh
        run: ./tool/setup_windows_go_cgo.ps1

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install native dependencies
        shell: pwsh
        run: |
          $innoDirectory = "${env:ProgramFiles(x86)}/Inno Setup 6"
          if (!(Test-Path "$innoDirectory/ISCC.exe")) { choco install innosetup -y --no-progress }
          $innoDirectory >> $env:GITHUB_PATH

      - name: Build Windows installer
        env:
          FLCLASHX_GITHUB_CLIENT_ID: ${{ vars.FLCLASHX_GITHUB_CLIENT_ID }}
          FLCLASHX_GITEE_OAUTH_URL: ${{ vars.FLCLASHX_GITEE_OAUTH_URL }}
        run: |
          git config core.longpaths true
          flutter pub get
          dart setup.dart windows --env stable --targets exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/FlClashX-*.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build signed APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          FLCLASHX_ANDROID_UPDATER: ${{ !inputs.android_test_only }}
          ANDROID_TEST_ONLY: ${{ inputs.android_test_only }}
          FLCLASHX_KEYSTORE: ${{ secrets.KEYSTORE }}
          FLCLASHX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLCLASHX_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          FLCLASHX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FLCLASHX_GITHUB_CLIENT_ID: ${{ vars.FLCLASHX_GITHUB_CLIENT_ID }}
          FLCLASHX_GITEE_OAUTH_URL: ${{ vars.FLCLASHX_GITEE_OAUTH_URL }}
        run: |
          if [[ "$ANDROID_TEST_ONLY" == true ]]; then
            unset FLCLASHX_KEYSTORE FLCLASHX_KEY_ALIAS FLCLASHX_STORE_PASSWORD FLCLASHX_KEY_PASSWORD
          else
            if [[ -z "$FLCLASHX_KEYSTORE" || -z "$FLCLASHX_KEY_ALIAS" || -z "$FLCLASHX_STORE_PASSWORD" || -z "$FLCLASHX_KEY_PASSWORD" ]]; then
              echo 'Android release signing secrets are required' >&2
              exit 1
            fi
            umask 077
            trap 'rm -f android/app/keystore.jks' EXIT
            printf '%s' "$FLCLASHX_KEYSTORE" | base64 --decode > android/app/keystore.jks
            unset FLCLASHX_KEYSTORE
          fi
          flutter build apk --release --split-per-abi \
            --dart-define=APP_ENV=stable \
            --dart-define=FLCLASHX_UPDATE_REPOSITORY="$FLCLASHX_UPDATE_REPOSITORY" \
            --dart-define=FLCLASHX_GITHUB_CLIENT_ID="$FLCLASHX_GITHUB_CLIENT_ID" \
            --dart-define=FLCLASHX_GITEE_OAUTH_URL="$FLCLASHX_GITEE_OAUTH_URL"

      - name: Verify signed APKs
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          ANDROID_TEST_ONLY: ${{ inputs.android_test_only }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$build_tools"
          build_tools="$(dirname "$build_tools")"
          mkdir -p dist
          signer=''
          package_id=com.follow.clash
          suffix=''
          if [[ "$ANDROID_TEST_ONLY" == true ]]; then
            package_id=com.follow.clash.dev
            suffix=-test
          fi
          for abi in armeabi-v7a arm64-v8a x86_64; do
            case "$abi" in
              armeabi-v7a) version_code=$((BUILD + 1000)) ;;
              arm64-v8a) version_code=$((BUILD + 2000)) ;;
              x86_64) version_code=$((BUILD + 4000)) ;;
            esac
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            badging="$("$build_tools/aapt" dump badging "$apk")"
            printf 'APK metadata for %s\n' "$abi"
            sed -n '/^package: /p; /^native-code: /p' <<< "$badging"
            package_line="$(sed -n '/^package: /p' <<< "$badging")"
            [[ "$package_line" == "package: name='$package_id' "* && "$package_line" == *" versionName='$VERSION'"* ]]
            abi_list="$(sed -n '/^native-code: /p' <<< "$badging")"
            if [[ "$ANDROID_TEST_ONLY" != true ]]; then
              [[ "$package_line" == *" versionCode='$version_code'"* ]]
              grep -Exq "native-code: '$abi'[[:space:]]*" <<< "$abi_list"
              grep -Fq "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" <<< "$badging"
            else
              [[ "$abi_list" == *" '$abi'"* ]]
            fi
            certificate="$("$build_tools/apksigner" verify --print-certs "$apk")"
            digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$certificate")"
            test -n "$digest"
            if [[ -n "$signer" && "$signer" != "$digest" ]]; then
              echo 'APK signing certificates differ across ABIs' >&2
              exit 1
            fi
            signer="$digest"
            cp "$apk" "dist/FlClashX-$VERSION-android-$abi$suffix.apk"
          done

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.android_test_only && 'android-test-apks' || 'android-apks' }}
          path: dist/*.apk
          if-no-files-found: error

  macos:
    needs: version
    if: ${{ !inputs.android_test_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: macos-15-intel
          - arch: arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            services/desktop/go.sum
            plugins/go_api/native/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Select Xcode for Intel package
        if: matrix.arch == 'amd64'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Build and verify DMG
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
          FLCLASHX_GITHUB_CLIENT_ID: ${{ vars.FLCLASHX_GITHUB_CLIENT_ID }}
          FLCLASHX_GITEE_OAUTH_URL: ${{ vars.FLCLASHX_GITEE_OAUTH_URL }}
        run: |
          flutter pub get
          python3 tool/patch_flutter_macos_aot.py "$FLUTTER_ROOT"
          dart setup.dart macos --env stable --targets dmg
          app=build/macos/Build/Products/Release/FlClashX.app
          arch="$PACKAGE_ARCH"
          if [[ "$arch" == amd64 ]]; then arch=x86_64; fi
          for binary in FlClashX FlClashCore FlClashDesktop; do
            lipo "$app/Contents/MacOS/$binary" -verify_arch "$arch"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.follow.clash
          test -f "dist/FlClashX-$VERSION-macos-$PACKAGE_ARCH.dmg"

      - name: Upload verified DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  manifest:
    needs: [version, windows, android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate and check update manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 -B -m unittest discover -s tool -p test_create_update_manifest.py
          mkdir -p dist
          cp release-assets/windows-amd64/*.exe release-assets/windows-arm64/*.exe dist/
          cp release-assets/android-apks/*.apk dist/
          cp release-assets/macos-amd64/*.dmg release-assets/macos-arm64/*.dmg dist/
          python3 tool/create_update_manifest.py \
            --repository "$FLCLASHX_UPDATE_REPOSITORY" --tag "$RELEASE_TAG" \
            --windows-amd64 release-assets/windows-amd64/*.exe \
            --windows-arm64 release-assets/windows-arm64/*.exe \
            --macos-amd64 "dist/FlClashX-$VERSION-macos-amd64.dmg" \
            --macos-arm64 "dist/FlClashX-$VERSION-macos-arm64.dmg" \
            --android-armeabi-v7a "dist/FlClashX-$VERSION-android-armeabi-v7a.apk" \
            --android-arm64-v8a "dist/FlClashX-$VERSION-android-arm64-v8a.apk" \
            --android-x86_64 "dist/FlClashX-$VERSION-android-x86_64.apk"

      - name: Upload stable release assets
        uses: actions/upload-artifact@v4
        with:
          name: flclashx-stable-release-assets
          path: dist/
          if-no-files-found: error
